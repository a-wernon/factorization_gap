run_name: head_proxy_qwen3_8b_b16_v4_overnight

models:
  target: Qwen/Qwen3-8B
  drafter: z-lab/Qwen3-8B-DFlash-b16
  dtype: bfloat16
  device: cuda
  enable_thinking: false

data:
  # Scale: all four available dflash datasets (gsm8k/math500/humaneval/mbpp
  # test splits) + 4× longer greedy gen → ~40K blocks (vs ~5K in v3).
  datasets: [gsm8k, math500, humaneval, mbpp]
  num_prompts: 3000            # caps; ~2410 actually available
  blocks_per_prompt: 32        # ceiling; gen_max_new_tokens / block_size
  gen_max_new_tokens: 512      # 4× v3; gives 4× blocks per prompt
  block_size: 16
  seed: 42

features:
  cache_dir: cache/features
  # Fresh cache — different dataset mix + longer gen than gsm8k_train_2k_b16.
  cache_name: mix4ds_gen512_b16

training:
  # CP rank sweep — rank is effectively free up to r=32 on Qwen-vocab per R2.
  ranks: [8, 16, 32]
  # Aux load-balancing sweep. λ=0 = vanilla (collapse-prone); λ=0.1 adds
  # entropy pressure on batch-averaged gate. Both trained for every rank.
  aux_lambdas: [0.0, 0.1]
  # FF controls.
  include_ff_r1: true          # rank-1 shared-trunk; per-position gain only
  include_ff_mlp: true         # shared residual MLP; capacity only
  include_ff_gain_mlp: true    # per-position gain + shared MLP; strong FF
  mlp_hidden: 128
  # Optim — more epochs than v3 now that data is ~7× larger.
  epochs: 30
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 0.0
  val_frac: 0.1                # ~4K val blocks out of ~40K total
  log_every: 100

output:
  root: runs/head_proxy
  tb: true

kill_criterion:
  min_improvement_pct: 2.0
